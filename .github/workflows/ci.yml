name: NodeJS CI

on:
  push:
    branches: [ "README.md" ]
  pull_request:
    branches: [ "README.md" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Lint
      run: |
        npm install
        npm run lint
